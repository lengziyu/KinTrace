services:
  postgres:
    image: postgres:16
    container_name: kintrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kintrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kintrace-postgres-data:/var/lib/postgresql/data

volumes:
  kintrace-postgres-data:
